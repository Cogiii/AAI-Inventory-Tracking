# Docker Compose for Production (Lightsail)
services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: aai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./documentation/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - aai-network

  # Backend Server
  server:
    image: ghcr.io/cogiii/aai-inventory-tracking/server:${IMAGE_TAG:-latest}
    container_name: aai-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CLIENT_URL: ${CLIENT_URL}
      BCRYPT_ROUNDS: 12
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aai-network

  # Frontend Client
  client:
    image: ghcr.io/cogiii/aai-inventory-tracking/client:${IMAGE_TAG:-latest}
    container_name: aai-client
    restart: always
    depends_on:
      - server
    networks:
      - aai-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client
      - server
    networks:
      - aai-network

volumes:
  mysql_data:

networks:
  aai-network:
    driver: bridge
